<div class="mt-3">
  <p-panel [header]="titleName" [toggleable]="true">
    <form [formGroup]="queryForm">
      <div class="grid p-fluid">
        <div class="col-12 md:col-2 lg:col-2">
          <label for="DBSource" class="bpaas-required">資料庫別</label>
          <p-dropdown
            id="DBSource"
            [options]="options"
            formControlName="DBSource"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
            [ngClass]="{ 'ng-dirty': formControlInvalid('DBSource') }"
          >
          </p-dropdown>
          <div *ngIf="formControlInvalid('DBSource')">
            <small
              class="p-error"
              *ngIf="formControl('DBSource').errors?.['required']"
            >
              此欄位必須輸入
            </small>
          </div>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="GroupId">群組代碼</label>
          <input
            type="text"
            id="GroupId"
            pInputText
            formControlName="GroupId"
          />
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="GroupName">群組名稱</label>
          <input
            type="text"
            id="GroupName"
            pInputText
            formControlName="GroupName"
          />
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="UserId">使用者帳號</label>
          <input type="text" id="UserId" pInputText formControlName="UserId" />
        </div>
        <div class="col-12 md:col-3 lg:col-3">
          <label for="Status">狀態</label>
          <div class="flex">
            <div class="flex align-items-center">
              <p-radioButton
                formControlName="Status"
                value=""
                inputId="Status"
              />
              <label for="Status" class="mx-1">全部</label>
            </div>
            <div class="flex align-items-center">
              <p-radioButton
                formControlName="Status"
                value="Y"
                inputId="Status"
              />
              <label for="Status" class="mx-1">啟用</label>
            </div>
            <div class="flex align-items-center">
              <p-radioButton
                formControlName="Status"
                value="N"
                inputId="Status"
              />
              <label for="Status" class="mx-1">停用</label>
            </div>
          </div>
        </div>
      </div>
      <div class="grid p-fluid justify-content-end bpaas-button-row">
        <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
          <button
            type="button"
            pButton
            label="查詢"
            (click)="doQuery()"
          ></button>
        </div>
        <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
          <button
            type="button"
            pButton
            label="清除"
            class="p-button-outlined mr-2"
            (click)="onClearForm()"
          ></button>
        </div>
      </div>
    </form>
  </p-panel>
</div>
<div *ngIf="queryTime" class="mb-3">資料查詢時間：{{ queryTime }}</div>
<p-panel [showHeader]="false">
  <p-menubar
    *ngIf="shouldShowMenubar"
    [model]="editMenu"
    class="bpaas-detail-menubar"
  ></p-menubar>
  <p-table
    #tableComponent
    [value]="tableData"
    [columns]="tableColumns"
    [(selection)]="rowSelectedData"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 15, 20]"
    [showCurrentPageReport]="true"
    scrollHeight="50vh"
    [scrollable]="true"
    stateStorage="session"
    [stateKey]="tableStateStorageName"
    styleClass="p-datatable-gridlines p-datatable-sm p-datatable-striped"
    [resizableColumns]="true"
    (onStateSave)="onDetailTableStateSave($event)"
    currentPageReportTemplate="顯示第 {first} 至 {last} 筆，共 {totalRecords} 筆"
  >
    <ng-template pTemplate="header" let-columns>
      <tr id="bpaas-table-header"></tr>
      <tr id="bpaas-table-header">
        <th
          alignFrozen="left"
          pFrozenColumn
          scope="col"
          style="
            min-width: 42px !important;
            max-width: 42px !important;
            width: 42px !important;
            text-align: center;
          "
        >
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>
        <th scope="col">筆數</th>
        <th
          *ngFor="let column of columns"
          [pSortableColumn]="column.sortable ? column.field : ''"
          [pSortableColumnDisabled]="column.sortable ? false : true"
          scope="col"
          pResizableColumn
        >
          <label for="{{ column.field }}">
            {{ column.header }}
          </label>
          <p-sortIcon
            *ngIf="column.sortable"
            [field]="column.field"
          ></p-sortIcon>
        </th>
      </tr>
    </ng-template>
    <ng-template
      pTemplate="body"
      let-rowData
      let-rowIndex="rowIndex"
      let-columns="columns"
    >
      <tr>
        <td
          alignFrozen="left"
          pFrozenColumn
          style="
            min-width: 42px !important;
            max-width: 42px !important;
            width: 42px !important;
            text-align: center;
          "
        >
          <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
        </td>
        <td class="text">{{ rowData.serialNumber }}</td>
        <td
          *ngFor="let column of columns"
          (click)="doOpenUpdateDialog(rowData)"
          (keydown)="doOpenUpdateDialog(rowData)"
          style="cursor: pointer"
        >
          {{ rowData[column.field] }}
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [colSpan]="tableColumns.length + 2">沒有符合條件的資料</td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
