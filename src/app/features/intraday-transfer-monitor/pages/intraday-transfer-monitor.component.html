<div class="mt-3">
  <p-panel [header]="titleName" [toggleable]="true">
    <form [formGroup]="formGroup">
      <div class="grid p-fluid">
        <div class="col-12 md:col-2 lg:col-2">
          <label for="DBSource" class="bpaas-required">資料庫別</label>
          <p-dropdown
            id="DBSource"
            [options]="options"
            formControlName="DBSource"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
          >
          </p-dropdown>
        </div>

        <div class="col-12 md:col-2 lg:col-2">
          <label for="Status">轉檔狀態</label>
          <p-dropdown
            id="Status"
            [options]="statusOptions"
            formControlName="Status"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
          >
          </p-dropdown>
        </div>

        <div class="col-12 md:col-2 lg:col-2">
          <label for="FCode">轉檔名稱</label>
          <p-dropdown
            id="FCode"
            [options]="conversionsOptions"
            formControlName="FCode"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
          >
          </p-dropdown>
        </div>

        <div class="col-12 md:col-4 lg:col-4">
          <label for="Time">查詢時間(每次查詢30分鐘，格式HHMMSS)</label>
          <input
            type="text"
            id="Time"
            pInputText
            formControlName="Time"
            maxlength="6"
            [ngClass]="{ 'ng-dirty': formControlInvalid('Time') }"
          />
          <small *ngIf="formControlInvalid('Time')" class="p-error">
            {{ showErrorMessage("Time") }}
          </small>
        </div>
      </div>
      <div class="grid p-fluid justify-content-end bpaas-button-row">
        <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
          <button
            type="button"
            pButton
            label="查詢"
            (click)="doQuery()"
          ></button>
        </div>
        <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
          <button
            type="button"
            pButton
            label="清除"
            class="p-button-outlined mr-2"
            (click)="onClearForm()"
          ></button>
        </div>
      </div>
    </form>
  </p-panel>
</div>

<div *ngIf="queryTime" class="mb-3">資料查詢時間：{{ queryTime }}</div>

<p-panel [showHeader]="false">
  <p-table
    #tableComponent
    [value]="tableData"
    [columns]="tableColumns"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 15, 20]"
    scrollHeight="50vh"
    [scrollable]="true"
    currentPageReportTemplate="顯示第 {first} 至 {last} 筆，共 {totalRecords} 筆"
    styleClass="p-datatable-gridlines p-datatable-sm p-datatable-striped"
    [resizableColumns]="true"
  >
    <ng-template pTemplate="header" let-columns>
      <tr id="bpaas-table-header">
        <th
          *ngFor="let column of columns"
          [pSortableColumn]="column.sortable ? column.field : ''"
          [pSortableColumnDisabled]="column.sortable ? false : true"
          scope="col"
          pResizableColumn
        >
          <label for="{{ column.field }}">
            {{ column.header }}
          </label>
          <p-sortIcon
            *ngIf="column.sortable"
            [field]="column.field"
          ></p-sortIcon>
        </th>
      </tr>
    </ng-template>
    <ng-template
      pTemplate="body"
      let-rowData
      let-rowIndex="rowIndex"
      let-columns="columns"
    >
      <tr>
        <td
          *ngFor="let column of columns"
          [class.bpaas-align-right]="column.numberField"
        >
          <ng-container *ngIf="column.field === 'TrStatus'">
            <div
              [class.text-primary]="rowData[column.field] === 'Y'"
              [class.text-red]="rowData[column.field] !== 'Y'"
            >
              {{ rowData[column.field] === 'Y' ? '轉檔成功' : '轉檔失敗' }}
            </div>
          </ng-container>
          <ng-container *ngIf="column.field !== 'TrStatus'">
            <ng-container *ngIf="column.numberField">
              {{
                rowData[column.field] ??
                  (column.numberFieldDefaultZero ? 0 : '') | dynamicDecimal
              }}
            </ng-container>
            <ng-container *ngIf="!column.numberField">
              {{ rowData[column.field] }}
            </ng-container>
          </ng-container>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [colSpan]="tableColumns.length + 2">沒有符合條件的資料</td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
