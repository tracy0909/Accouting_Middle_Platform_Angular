<div class="mt-3">
  <p-panel [header]="titleName" [toggleable]="true">
    <form [formGroup]="queryForm">
      <div class="grid p-fluid">
        <div class="col-12 md:col-2 lg:col-2">
          <label for="DBSource" class="bpaas-required">資料庫別</label>
          <p-dropdown
            id="DBSource"
            [options]="options"
            formControlName="DBSource"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
            [ngClass]="{ 'ng-dirty': formControlInvalid('DBSource') }"
          >
          </p-dropdown>
          <div *ngIf="formControlInvalid('DBSource')">
            <small
              class="p-error"
              *ngIf="formControl('DBSource').errors?.['required']"
            >
              此欄位必須輸入
            </small>
          </div>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="LoginId">使用者登入代碼</label>
          <input
            type="text"
            id="LoginId"
            pInputText
            formControlName="LoginId"
          />
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="DateStart">登入日期(起)</label>
          <p-calendar
            [showIcon]="true"
            appendTo="body"
            dateFormat="yy/mm/dd"
            formControlName="DateStart"
            [showOnFocus]="false"
            id="DateStart"
          >
          </p-calendar>
          <small *ngIf="isDateInvalid" class="p-error">
            {{ showErrorMessage("DateStart") }}
          </small>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="DateEnd"
            >登入日期 (迄)
            <i
              class="pi pi-question-circle ml-2"
              pTooltip="請輸入日期格式如2022/01/01，預設查詢區間近3個月"
              tooltipPosition="right"
            ></i
          ></label>
          <p-calendar
            [showIcon]="true"
            appendTo="body"
            dateFormat="yy/mm/dd"
            formControlName="DateEnd"
            [showOnFocus]="false"
            id="DateEnd"
          >
          </p-calendar>
          <small *ngIf="isDateInvalid" class="p-error">
            {{ showErrorMessage("DateEnd") }}
          </small>
        </div>
        <div class="col-12 md:col-3 lg:col-3">
          <label for="StatusCode">登入狀態</label>
          <div class="flex">
            <div class="flex align-items-center">
              <p-radioButton
                formControlName="StatusCode"
                value=""
                inputId="StatusCode"
              />
              <label for="StatusCode" class="mx-1">全部</label>
            </div>
            <div class="flex align-items-center">
              <p-radioButton
                formControlName="StatusCode"
                value="0"
                inputId="StatusCode"
              />
              <label for="StatusCode" class="mx-1">成功</label>
            </div>
            <div class="flex align-items-center">
              <p-radioButton
                formControlName="StatusCode"
                value="1"
                inputId="StatusCode"
              />
              <label for="StatusCode" class="mx-1">失敗</label>
            </div>
          </div>
        </div>
      </div>
      <div class="grid p-fluid justify-content-end bpaas-button-row">
        <!-- 查詢按鈕 -->
        <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
          <button
            type="button"
            pButton
            (click)="doQuery()"
            label="查詢"
          ></button>
        </div>
        <!-- 重設按鈕 -->
        <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
          <button
            type="button"
            pButton
            label="清除"
            class="p-button-outlined mr-2"
            (click)="onClearForm()"
          ></button>
        </div>
      </div>
    </form>
  </p-panel>
</div>

<div *ngIf="queryTime" class="mb-3">資料更新時間：{{ queryTime }}</div>

<!-- 顯示表格和選單列的面板 -->
<p-panel [showHeader]="false">
  <!-- 顯示系統參數資料的表格 -->
  <p-table
    #tableComponent
    [value]="tableData"
    [columns]="tableColumns"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 15, 20]"
    scrollHeight="50vh"
    [scrollable]="true"
    styleClass="p-datatable-gridlines p-datatable-sm p-datatable-striped"
    [resizableColumns]="true"
    currentPageReportTemplate="顯示第 {first} 至 {last} 筆，共 {totalRecords} 筆"
  >
    <ng-template pTemplate="header" let-columns>
      <!-- 表頭，包含用於選擇的複選框 -->
      <tr id="bpaas-table-header">
        <!-- 動態產生的列頭 -->
        <th
          *ngFor="let column of columns"
          [pSortableColumn]="column.sortable ? column.field : ''"
          [pSortableColumnDisabled]="column.sortable ? false : true"
          scope="col"
          pResizableColumn
        >
          <label for="{{ column.field }}">
            {{ column.header }}
          </label>
          <p-sortIcon
            *ngIf="column.sortable"
            [field]="column.field"
          ></p-sortIcon>
        </th>
      </tr>
    </ng-template>
    <ng-template
      pTemplate="body"
      let-rowData
      let-rowIndex="rowIndex"
      let-columns="columns"
    >
      <tr>
        <td *ngFor="let column of columns">
          {{ rowData[column.field] }}
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [colSpan]="tableColumns.length + 2">沒有符合條件的資料</td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
