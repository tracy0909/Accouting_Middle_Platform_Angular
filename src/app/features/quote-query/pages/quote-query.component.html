<div class="mt-3">
  <p-panel [header]="titleName" [toggleable]="true">
    <div class="card">
      <form [formGroup]="formGroup">
        <div class="grid p-fluid">
          <div class="col-12 md:col-12 lg:col-12">
            <app-stock-suggestions
              [stockControl]="stockControl"
            ></app-stock-suggestions>
            <small *ngIf="formControlInvalid('stock')" class="p-error">
              {{ '此欄位為必填欄位，最多查詢10個股票代號' }}
            </small>
          </div>
        </div>
        <div class="grid p-fluid justify-content-end bpaas-button-row">
          <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
            <button
              type="submit"
              pButton
              label="查詢"
              (click)="doQuery()"
            ></button>
          </div>
          <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
            <button
              type="button"
              pButton
              label="清除"
              class="p-button-outlined mr-2"
              (click)="onClear()"
            ></button>
          </div>
        </div>
      </form>
    </div>
  </p-panel>
  <div *ngIf="queryTime" class="mt-2 mb-2 text-left">
    資料查詢時間：{{ queryTime }}
  </div>
  <div *ngIf="tableData.length > 0">
    <ng-container *ngFor="let table of tableData; let i = index">
      <p-panel [header]="'報價主機: ' + apiNames[i] + ' / ' + apiTargets[i]">
        <p-table
          #quoteTable
          [columns]="tableColumns"
          [value]="table.data"
          [paginator]="false"
          [rows]="5"
          [showCurrentPageReport]="true"
          currentPageReportTemplate="顯示第 {first} 至 {last} 筆，共 {totalRecords} 筆"
          [rowsPerPageOptions]="[2, 5, 10]"
          scrollHeight="75vh"
          [scrollable]="true"
          [resizableColumns]="true"
          styleClass="p-datatable-gridlines p-datatable-sm p-datatable-striped"
        >
          <ng-template pTemplate="header">
            <tr id="bpaas-table-header">
              <th
                *ngFor="let column of tableColumns"
                [pSortableColumn]="column.sortable ? column.field : ''"
                [pSortableColumnDisabled]="column.sortable ? false : true"
                pResizableColumn
                [id]="column.field"
              >
                {{ column.header }}
                <p-sortIcon
                  *ngIf="column.sortable"
                  [field]="column.field"
                ></p-sortIcon>
              </th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
              <td
                *ngFor="let column of columns"
                [class.bpaas-align-right]="column.numberField"
              >
                <ng-container *ngIf="column.numberField">
                  {{
                    rowData[column.field] ??
                      (column.numberFieldDefaultZero ? 0 : "") | dynamicDecimal
                  }}
                </ng-container>
                <ng-container *ngIf="!column.numberField">
                  {{ rowData[column.field] }}
                </ng-container>
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td [colSpan]="tableColumns.length + 2">沒有符合條件的資料</td>
            </tr>
          </ng-template>
        </p-table>
      </p-panel>
    </ng-container>
  </div>
</div>
