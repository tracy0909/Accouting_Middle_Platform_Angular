<div class="mt-3">
  <p-panel [header]="titleName" [toggleable]="true">
    <form [formGroup]="formGroup">
      <div class="grid p-fluid">
        <div class="col-12 md:col-2 lg:col-2">
          <label for="APISERVER" class="bpaas-required">查詢帳中API主機</label>
          <p-dropdown
            id="APISERVER"
            [options]="options"
            formControlName="APISERVER"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
            [ngClass]="{ 'ng-dirty': formControlInvalid('APISERVER') }"
          >
          </p-dropdown>
          <div *ngIf="formControlInvalid('APISERVER')">
            <small
              class="p-error"
              *ngIf="formControl('APISERVER').errors?.['required']"
            >
              此欄位必須輸入
            </small>
          </div>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="bdate" class="bpaas-required">申購起始日 (起)</label>
          <p-calendar
            [showIcon]="true"
            appendTo="body"
            dateFormat="yy/mm/dd"
            dataType="string"
            formControlName="bdate"
            [showOnFocus]="false"
            id="bdate"
            [ngClass]="{ 'ng-dirty': formControlInvalid('bdate') }"
          >
          </p-calendar>
          <small *ngIf="formGroup.controls['bdate']?.touched" class="p-error">
            {{ showErrorMessage('bdate') }}
          </small>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="edate" class="bpaas-required">
            申購起始日 (迄)
            <i
              class="pi pi-question-circle ml-2"
              pTooltip="請輸入日期格式如2022/01/01，預設查詢區間近3個月"
              tooltipPosition="right"
            ></i>
          </label>
          <p-calendar
            [showIcon]="true"
            appendTo="body"
            dateFormat="yy/mm/dd"
            dataType="string"
            formControlName="edate"
            [showOnFocus]="false"
            id="edate"
            [ngClass]="{ 'ng-dirty': formControlInvalid('edate') }"
          >
          </p-calendar>
          <small *ngIf="formGroup.controls['edate']?.touched" class="p-error">
            {{ showErrorMessage('edate') }}
          </small>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="stkdate">撥劵日</label>
          <p-calendar
            [showIcon]="true"
            appendTo="body"
            dateFormat="yy/mm/dd"
            dataType="string"
            formControlName="stkdate"
            [showOnFocus]="false"
            id="stkdate"
          >
          </p-calendar>
        </div>
        <div class="col-12 md:col-4 lg:col-4">
          <app-stock-suggestions
            [stockControl]="stockControl"
            [stockNameControl]="stockNameControl"
          ></app-stock-suggestions>
        </div>
      </div>
      <div class="grid p-fluid justify-content-end bpaas-button-row">
        <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
          <button
            type="submit"
            pButton
            label="查詢"
            (click)="onSearch()"
          ></button>
        </div>
        <div *ngIf="buttonList.query" class="col-12 md:col-3 lg:col-2">
          <button
            type="button"
            pButton
            label="清除"
            class="p-button-outlined mr-2"
            (click)="onClearForm()"
          ></button>
        </div>
      </div>
    </form>
  </p-panel>
  <div class="flex justify-content-between mb-3 align-items-center">
    <div *ngIf="queryTime">資料查詢時間：{{ queryTime }}</div>
    <!-- <div *ngIf="hasSearched && buttonList.download" class="text-right">
      <button
        pButton
        type="button"
        label="匯出 Excel"
        icon="pi pi-file-excel"
        (click)="doExportToExcel()"
      ></button>
    </div> -->
  </div>
  <div>
    <p-panel [showHeader]="false">
      <p-table
        #offerTable
        [value]="offerDetails"
        [columns]="tableColumns"
        [paginator]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        [rowsPerPageOptions]="[10, 15, 20]"
        scrollHeight="50vh"
        [scrollable]="true"
        styleClass="p-datatable-gridlines p-datatable-sm p-datatable-striped"
        [resizableColumns]="true"
        currentPageReportTemplate="顯示第 {first} 至 {last} 筆，共 {totalRecords} 筆"
      >
        <ng-template pTemplate="header">
          <tr id="bpaas-table-header">
            <th
              *ngFor="let column of tableColumns"
              [pSortableColumn]="column.sortable ? column.field : ''"
              [pSortableColumnDisabled]="
                column.sortable && column.field !== 'no' ? false : true
              "
              [id]="'th-' + column.header"
              pResizableColumn
            >
              {{ column.header }}
              <p-sortIcon
                *ngIf="column.sortable && column.field !== 'no'"
                [field]="column.field"
              ></p-sortIcon>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-offer>
          <tr>
            <td
              *ngFor="let header of tableColumns"
              [class.bpaas-align-right]="header.numberField"
            >
              <ng-container *ngIf="header.numberField">
                {{
                  offer[header.field] ??
                    (header.numberFieldDefaultZero ? 0 : '') | dynamicDecimal
                }}
              </ng-container>
              <ng-container *ngIf="!header.numberField">
                {{ offer[header.field] }}
              </ng-container>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td [colSpan]="tableColumns.length + 1">沒有符合條件的資料</td>
          </tr>
        </ng-template>
      </p-table>
    </p-panel>
  </div>
</div>
