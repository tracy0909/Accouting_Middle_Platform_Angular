<div class="mt-3">
  <p-panel [header]="titleName" [toggleable]="true">
    <form [formGroup]="formGroup">
      <div class="grid p-fluid">
        <div class="col-12 md:col-2 lg:col-2">
          <label for="DBSource" class="bpaas-required">資料庫別</label>
          <p-dropdown
            id="DBSource"
            [options]="dbOption"
            formControlName="DBSource"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
          >
          </p-dropdown>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="UserId">使用者</label>
          <input
            type="text"
            id="UserId"
            formControlName="UserId"
            pInputText
            maxlength="15"
          />
        </div>
        <!-- 序號欄位 -->
        <div class="col-12 md:col-2 lg:col-2">
          <label for="ModuleId">功能代碼</label>
          <p-dropdown
            id="ModuleId"
            [options]="moduleIdOption"
            formControlName="ModuleId"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
            [showClear]="true"
          >
          </p-dropdown>
        </div>
        <!-- 設定值欄位 -->
        <div class="col-12 md:col-2 lg:col-2">
          <label for="ButtonTypes">按鈕種類</label>
          <p-dropdown
            id="ButtonTypes"
            [options]="buttonTypeOption"
            formControlName="ButtonTypes"
            optionValue="value"
            optionLabel="label"
            placeholder="請選擇"
            [showClear]="true"
          >
          </p-dropdown>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="DateTimeStart">建立日期</label>
          <p-calendar
            id="DateTimeStart"
            [showIcon]="true"
            dateFormat="yy/mm/dd"
            formControlName="DateTimeStart"
            [showTime]="true"
          ></p-calendar>
          <small *ngIf="isDateInvalid" class="p-error">
            {{ showErrorMessage('DateTimeStart') }}
          </small>
        </div>
        <div class="col-12 md:col-2 lg:col-2">
          <label for="DateTimeEnd">結束日期</label>
          <p-calendar
            id="DateTimeEnd"
            [showIcon]="true"
            dateFormat="yy/mm/dd"
            formControlName="DateTimeEnd"
            [showTime]="true"
          ></p-calendar>
          <small *ngIf="isDateInvalid" class="p-error">
            {{ showErrorMessage('DateTimeEnd') }}
          </small>
        </div>
      </div>
      <div
        *ngIf="buttonList.query"
        class="grid p-fluid justify-content-end bpaas-button-row"
      >
        <!-- 查詢按鈕 -->
        <div *ngIf="buttonList.query" class="col-12 md:col-2 lg:col-2">
          <button
            type="button"
            pButton
            label="查詢"
            (click)="doQuery()"
          ></button>
        </div>
        <!-- 重設按鈕 -->
        <div *ngIf="buttonList.query" class="col-12 md:col-2 lg:col-2">
          <button
            type="button"
            pButton
            label="清除"
            class="p-button-outlined mr-2"
            (click)="onClear()"
          ></button>
        </div>
      </div>
    </form>
  </p-panel>
</div>
<div *ngIf="queryTime" class="mt-2 mb-2 text-left">
  資料查詢時間：{{ queryTime }}
</div>
<p-panel [showHeader]="false">
  <p-table
    #usertHistQueryTable
    [value]="tableData"
    [columns]="tableColumns"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 15, 20]"
    scrollHeight="50vh"
    [scrollable]="true"
    stateStorage="session"
    styleClass="p-datatable-gridlines p-datatable-sm p-datatable-striped"
    [resizableColumns]="true"
    currentPageReportTemplate="顯示第 {first} 至 {last} 筆，共 {totalRecords} 筆"
  >
    <ng-template pTemplate="header" let-columns>
      <tr id="bpaas-table-header">
        <th scope="col">筆數</th>
        <th
          *ngFor="let column of columns"
          [pSortableColumn]="column.sortable ? column.field : ''"
          [pSortableColumnDisabled]="column.sortable ? false : true"
          scope="col"
          pResizableColumn
        >
          <label for="{{ column.field }}">
            {{ column.header }}
          </label>
          <p-sortIcon
            *ngIf="column.sortable"
            [field]="column.field"
          ></p-sortIcon>
        </th>
      </tr>
    </ng-template>
    <ng-template
      pTemplate="body"
      let-rowData
      let-rowIndex="rowIndex"
      let-columns="columns"
    >
      <tr>
        <td class="text">{{ rowData.serialNumber }}</td>
        <td
          *ngFor="let column of columns"
          style="cursor: pointer"
          [class.bpaas-align-right]="column.numberField"
        >
          <ng-container *ngIf="column.field === 'ButtonType'">
            {{ getButtonTypeDisplayName(rowData.ButtonType) }}
          </ng-container>
          <ng-container *ngIf="column.field !== 'ButtonType'">
            {{ rowData[column.field] }}
          </ng-container>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [colSpan]="tableColumns.length + 2">沒有符合條件的資料</td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
